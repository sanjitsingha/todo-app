<!--
  Supabase "Reset password" email, as a code rather than a link. The app's forgot password
  screen asks for this code (src/app/(auth)/forgot-password.tsx), so the email doesn't need to
  open the app.

  Paste it into the Supabase dashboard: Authentication > Emails > Templates > Reset password
  (Subject: Your password reset code). {{ .Token }} is the code; its length is set by
  "Email OTP Length" (Authentication > Sign In / Providers > Email) and must match CODE_LENGTH
  in forgot-password.tsx (6).
-->
<h2 style="margin: 0 0 16px; font-family: Arial, sans-serif; font-size: 22px; color: #111;">
  Reset your password
</h2>
<p style="margin: 0 0 16px; font-family: Arial, sans-serif; font-size: 15px; color: #333;">
  Enter this code in the app to choose a new password:
</p>
<p
  style="margin: 0 0 24px; font-family: 'Courier New', monospace; font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #111;"
>
  {{ .Token }}
</p>
<p style="margin: 0; font-family: Arial, sans-serif; font-size: 13px; color: #666;">
  The code only works for a short time. If you didn’t ask to reset your password, you can
  ignore this email.
</p>
